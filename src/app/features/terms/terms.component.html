<section class="terms-hero">
  <div class="terms-hero__bg" aria-hidden="true"></div>
  <div class="terms-hero__inner">
    <div class="terms-hero__content">
      <span class="terms-hero__label">{{ terms.label }}</span>
      <h1 class="terms-hero__title display">
        <span>{{ terms.titleTop }}</span>
        <span class="accent">{{ terms.titleAccent }}</span>
      </h1>
      <p class="terms-hero__intro">{{ terms.intro }}</p>
    </div>
  </div>
</section>



<section class="terms-full">
  <div class="terms-full__inner">
    <header class="terms-full__header">
      <h2 class="terms-full__title display">{{ terms.fullTermsTitle }}</h2>
      <span class="terms-full__underline" aria-hidden="true"></span>
      <p class="terms-full__subtitle text-muted">{{ terms.fullTermsSubtitle }}</p>
    </header>

    <article class="terms-full__section" *ngFor="let section of terms.fullTerms">
      <h3 class="terms-full__section-title">{{ section.title }}</h3>
      <p class="terms-full__section-intro text-muted">{{ section.intro }}</p>

      <ol class="terms-full__clauses">
        <li class="terms-full__clause" *ngFor="let clause of section.clauses">
          <h4 class="terms-full__clause-title">
            <span class="terms-full__clause-num">{{ clause.number }}.</span>
            {{ clause.title }}
          </h4>
          <p class="terms-full__clause-body text-muted">{{ clause.body }}</p>
        </li>
      </ol>
    </article>

    <aside class="terms-notice" role="note">
      <div class="terms-notice__icon" aria-hidden="true">
        <ui-icon name="alert-triangle" [size]="28"></ui-icon>
      </div>
      <p class="terms-notice__text">
        <strong>IMPORTANT:</strong> {{ terms.importantNotice }}
      </p>
    </aside>
  </div>
</section>
