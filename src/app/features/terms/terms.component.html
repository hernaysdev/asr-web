<section class="terms-hero">
  <div class="terms-hero__bg" aria-hidden="true"></div>
  <div class="terms-hero__inner">
    <div class="terms-hero__content">
      <span class="terms-hero__label">{{ terms.label }}</span>
      <h1 class="terms-hero__title display">
        <span>{{ terms.titleTop }}</span>
        <span class="accent">{{ terms.titleAccent }}</span>
      </h1>
      <p class="terms-hero__intro">{{ terms.intro }}</p>
    </div>
  </div>
</section>

<section class="terms-overview">
  <div class="terms-overview__inner">
    <header class="terms-overview__header">
      <h2 class="terms-overview__title display">{{ terms.overviewTitle }}</h2>
      <span class="terms-overview__underline" aria-hidden="true"></span>
      <p class="terms-overview__subtitle text-muted">{{ terms.overviewSubtitle }}</p>
    </header>

    <ul class="terms-grid">
      <li class="terms-card" *ngFor="let item of terms.items">
        <div class="terms-card__icon">
          <ui-icon [name]="item.icon" [size]="28"></ui-icon>
        </div>
        <div class="terms-card__body">
          <h3 class="terms-card__title">
            <span class="terms-card__num">{{ item.number }}.</span> {{ item.title }}
          </h3>
          <p class="terms-card__desc text-muted">{{ item.description }}</p>
        </div>
      </li>
    </ul>

    <div class="terms-cta">
      <div class="terms-cta__icon" aria-hidden="true">
        <ui-icon name="file-text" [size]="32"></ui-icon>
      </div>
      <p class="terms-cta__text">{{ terms.cta.text }}</p>
      <a
        class="terms-cta__button"
        [href]="terms.cta.href"
        target="_blank"
        rel="noopener"
      >
        <ui-button variant="primary">{{ terms.cta.buttonLabel }}</ui-button>
      </a>
    </div>

    <aside class="terms-notice" role="note">
      <div class="terms-notice__icon" aria-hidden="true">
        <ui-icon name="alert-triangle" [size]="28"></ui-icon>
      </div>
      <p class="terms-notice__text">
        <strong>IMPORTANT:</strong> {{ terms.importantNotice }}
      </p>
    </aside>
  </div>
</section>
