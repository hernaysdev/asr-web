<section id="about" class="about">
  <div class="about__inner">
    <div class="about__content">
      <asr-section-title eyebrow="About" leading="About" accent="Us"></asr-section-title>

      <div class="about__copy text-muted">
        <p *ngFor="let paragraph of content.about.paragraphs">{{ paragraph }}</p>
      </div>

      <div class="about__values">
        <article class="value-card" *ngFor="let value of content.values">
          <div class="value-card__icon">
            <ui-icon [name]="value.icon" [size]="40"></ui-icon>
          </div>
          <h3 class="value-card__title">{{ value.title }}</h3>
          <p class="value-card__copy text-muted">{{ value.description }}</p>
        </article>
      </div>

      <div class="about__cta">
        <ui-button variant="primary" (click)="scheduleAppointment()">Schedule an Appointment</ui-button>
      </div>
    </div>

    <div class="about__media" aria-hidden="true"></div>
  </div>
</section>
